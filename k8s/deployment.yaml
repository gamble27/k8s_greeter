# 1. THE BUDGET GUARDRAIL (Namespace-wide)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: greeter-quota
spec:
  hard:
    pods: "10"                  # 🛑 Hard cap: never more than 10 pods total
    requests.cpu: "500m"        # 💰 Max 0.5 CPU cores across all pods
    requests.memory: "1Gi"      # 💰 Max 1GB RAM total
---
# 2. THE BLUEPRINT (Your Application)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-greeter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeter # should match template label otherwise won't manage container and just ups a Pod
  template:
    metadata:
      labels:
        app: greeter # this should be matched with above
    spec:
      containers:
      - name: greeter-app
        image: us-central1-docker.pkg.dev/sandbox-2026-02/greeter-repo/python-greeter:v1
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "50m"    # 0.1 vCPU
            memory: "128Mi" # 128 MiB
          limits:
            cpu: "100m"    # Allow it to burst if busy
            memory: "256Mi" # Safety ceiling
---
# 3. THE AUTOSCALER (Dynamic Growth)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: greeter-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: python-greeter        # Must match Deployment name
  minReplicas: 1                # Lower floor
  maxReplicas: 5                # Upper ceiling for this specific app
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50  # 📈 Scale up if CPU usage > 50%
---
# 4. THE EXTERNAL GATEWAY (Public IP)
apiVersion: v1
kind: Service
metadata:
  name: greeter-service
  annotations:
    # ⚡ Recommended for GKE: Use "Container-Native" load balancing
    cloud.google.com/l4-rbs: "enabled"
spec:
  type: LoadBalancer            # 🌍 Tells GKE to provision a Google Cloud LB
  selector:
    app: greeter                # 🎯 Must match the labels in your Deployment
  ports:
    - protocol: TCP
      port: 80                  # 🚪 The port people use (http://EXTERNAL_IP)
      targetPort: 8080          # 🎯 The port your Python app listens on